<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier - Architect Portfolio</title>
    <style>
        /* FONT IMPORTS */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@400;700&display=swap');

        /* RESET AND BASE STYLES */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #f9f9f9;
            --primary-text: #1a1a1a;
            --secondary-text: #555555;
            --accent-color: #a99a8e;
            --accent-darker: #93857a;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            font-size: 17px;
            line-height: 1.7;
            background-color: var(--bg-color);
            color: var(--primary-text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* TYPOGRAPHY */
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 500;
        }

        h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 3rem;
        }

        h3 {
            font-size: 1.5rem;
        }

        p {
            color: var(--secondary-text);
            margin-bottom: 1rem;
        }

        a {
            color: var(--primary-text);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--accent-color);
        }

        /* LAYOUT */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        section {
            padding: 6rem 0;
        }

        /* HEADER & NAVIGATION */
        .main-header {
            padding: 2rem 0;
        }

        .main-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        /* HERO SECTION */
        .hero {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-text {
            padding-left: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 0.75rem 1.5rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: var(--accent-darker);
            color: white;
        }

        /* GALLERY SECTION */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover img {
            opacity: 0.9;
        }

        /* FOOTER */
        .main-footer {
            padding: 3rem 0;
            text-align: center;
            border-top: 1px solid #e0e0e0;
        }

        .main-footer p {
            font-size: 0.9rem;
            color: var(--secondary-text);
        }

        /* RESPONSIVENESS */
        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-text {
                padding-left: 0;
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.8rem; }
            h2 { font-size: 2rem; }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
             .main-header .container {
                flex-direction: column;
                gap: 1rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <div class="logo">
                <h3><a href="#">ATELIER</a></h3>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#">Work</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="container">
                <div class="hero">
                    <div class="hero-image">
                        <img src="https://source.unsplash.com/800x600/?minimalist,architecture" alt="Minimalist architecture">
                    </div>
                    <div class="hero-text">
                        <h1>Where Form Meets Function</h1>
                        <p>We design spaces that are not only beautiful but are a quiet reflection of their inhabitants.</p>
                        <a href="#" class="btn">View Our Work</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="gallery-section">
            <div class="container">
                <h2>Selected Projects</h2>
                <div class="gallery-grid">
                    <div class="gallery-item">
                        <img src="https://source.unsplash.com/400x400/?interior,design,minimal" alt="Minimalist interior design 1">
                    </div>
                    <div class="gallery-item">
                        <img src="https://source.unsplash.com/400x400/?architecture,minimalist" alt="Minimalist interior design 2">
                    </div>
                    <div class="gallery-item">
                        <img src="https://source.unsplash.com/400x400/?house,interior" alt="Minimalist interior design 3">
                    </div>
                    <div class="gallery-item">
                        <img src="https://source.unsplash.com/400x400/?modern,architecture" alt="Minimalist interior design 4">
                    </div>
                    <div class="gallery-item">
                        <img src="https://source.unsplash.com/400x400/?minimalist,living,room" alt="Minimalist interior design 5">
                    </div>
                    <div class="gallery-item">
                        <img src="https://source.unsplash.com/400x400/?concrete,architecture" alt="Minimalist interior design 6">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 Atelier. Design for the discerning.</p>
        </div>
    </footer>

</body>
</html>
